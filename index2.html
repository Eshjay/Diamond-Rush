<script>
// DIAMOND RUN — GITHUB+ v1.3.2 PLAYTEST BUILD
// Built directly on the original GitHub engine.
// Core cascade / match resolver intentionally preserved.
const {
  useState,
  useCallback,
  useRef,
  useEffect,
  useLayoutEffect
} = React;

// ---- Config ----
const ROWS = 10;
const COLS = 10;
const GEM_NAMES = ["Red","Green","Blue","Yellow","Purple"];
const GEMS = [{
  color: "#ff5c7a",
  shape: "flame"
}, {
  color: "#6fe28d",
  shape: "leaf"
}, {
  color: "#4db8ff",
  shape: "drop"
}, {
  color: "#ffd34f",
  shape: "star"
}, {
  color: "#b06cff",
  shape: "gem"
}];
const SAVE_KEY = "diamondRunSave.v1"; // localStorage key — resumes progress on this device/browser only
const WELCOME_SEEN_KEY = "diamondRunWelcomeSeen.v1";
const CARRY_START_LEVEL = 31;
const MOVES_DECADE_STEP = 10; // base starting moves drop by this much...
const MOVES_DECADE_INTERVAL = 10; // ...every this many levels past 31
const MOVES_FLOOR = 20; // base starting moves never go below this
const CARRY_CAP_BASE = 10;
const CARRY_CAP_STEP = 0; // carry-over cap drops by this much...
const CARRY_CAP_INTERVAL = 1; // ...every this many levels past 31
const CARRY_CAP_FLOOR = 10;
const POWERUP_COSTS = {
  G: 2,
  arrow: 4,
  T: 6,
  R: 10
}; // excess moves needed per power-up
const MAX_HEAT_POWERUPS = 5; // heat-to-powerup conversion never seeds more than this many pieces
const HEAT_START_LEVEL = 21; // the heat meter doesn't begin tracking until this level
const DIFFICULTY_CYCLE_LENGTH = 20;
const MAX_LEVEL = 200; // difficulty ramps easy→hardest across a 20-level cycle, then resets
const DIFFICULTY_CYCLE_ESCALATION_RATE = 0.5; // each successive cycle ramps steeper, so its "hardest" tops the last
const DIFFICULTY_CYCLE_CAP = 10; // stop escalating across cycles after this many repeats (long-run safety)
const FILLER_WEIGHT = 12;
// v1.2: objective quotas no longer directly become refill weights.
// This prevents large calibrated objectives from creating runaway cascade floods.
const BONUS_POINTS_PER_GEM = 1000;
const SCORE_OBJECTIVE_LEVEL_INTERVAL = 3; // every 3rd level also requires a minimum score
const SCORE_OBJECTIVE_BASE = 100000;
const SCORE_OBJECTIVE_GROWTH = 16000;
const SCARCITY_LEVEL_INTERVAL = 4; // every 4th level, the rarest color is exact-count on the board
const FOCUS_LEVEL_INTERVAL = 7; // every 7th level, one color dominates the board
const CHECKPOINT_INTERVAL = 10; // progress is saved every 10 levels
const GRID_GAP = 4;
const GRID_PAD = 10;
const ICE_HITS = 1;
const GRASS_HITS = 2;
const WALL_HITS = 3;
const OBSTACLE_LEVEL_INTERVAL = 6; // every 6th level introduces ice, walls, or grass
const OIL_DROP_BONUS_MOVES = 2;
const OIL_DROP_BONUS_SCORE = 500;
const BONUS_LEVEL_INTERVAL = 5;
const TIMED_COLOR_SECONDS = 180; // 3 minutes, per your "get 2000 yellow in 3 minutes" example
const OIL_RUSH_SECONDS = 180; // time limit for the "clear N oil drops" bonus level type
const OIL_RUSH_BASE_COUNT = 5;
const COLOR_RUSH_MIN_SECONDS = 60;
const GRAVITY_SHIFT_MOVE_LIMIT = 10;

const LIGHT_SCRIPTURES = [
  { reference:"John 1:5", text:"The light shines in the darkness. But the darkness has not overcome the light." },
  { reference:"John 8:12", text:"I am the light of the world." },
  { reference:"Matthew 5:14", text:"You are the light of the world." },
  { reference:"Psalm 27:1", text:"The Lord is my light, and he saves me." },
  { reference:"1 John 1:5", text:"God is light. There is no darkness in him at all." },
  { reference:"Ephesians 5:8", text:"Live like children of the light." },
  { reference:"Psalm 119:105", text:"It is like a light that guides me." },
  { reference:"Isaiah 60:1", text:"Shine, because your light has come." },
  { reference:"2 Corinthians 4:6", text:"Let light shine out of darkness." },
  { reference:"Proverbs 4:18", text:"It shines brighter and brighter until the full light of day." }
];
function lightScriptureForLevel(level) {
  const occurrence = Math.max(0, Math.floor((level - 10) / DIFFICULTY_CYCLE_LENGTH));
  return LIGHT_SCRIPTURES[occurrence % LIGHT_SCRIPTURES.length];
}


// Levels 1–30: move counts vary (not a strict curve) between 25 and 40.
// From level 31 on, base starting moves step down by decade block (40 for
// 31-40, 30 for 41-50, 20 for 51-60 and onward — 20 is the permanent floor).
// Leftover moves separately carry over into the next level's total, capped by
// a declining ceiling (see carryCapForLevel) — excess beyond that cap
// converts to bonus rainbow gems instead of being lost.
function baseMovesForLevel(level) {
  if (level === 31) return 40;                         // transition level
  if (level >= 32) return 15 + Math.floor(Math.random() * 11); // 15..25
  return 25 + Math.floor(Math.random() * 16);          // original 1..30 feel
}

// The carry-over cap for moves finishing on `level` (carrying into level+1).
// 40 for levels 31-33, then drops by 5 every 3 levels, flooring at 10.
function carryCapForLevel(level) {
  if (level < CARRY_START_LEVEL) return 0;
  return 10;
}
function checkpointFor(level) {
  if (level <= CHECKPOINT_INTERVAL) return 1;
  return Math.floor((level - 1) / CHECKPOINT_INTERVAL) * CHECKPOINT_INTERVAL;
}

// 3 of the 5 colors get a quota each level; the other 2 are unrestricted filler.
// The color needed in the smallest quantity is deliberately the rarest to find.
// Every few levels also adds a minimum-score objective, an exact-count "scarcity"
// color, or a "focus" level where one color dominates the whole board.
function generateObjectives(level, colorRushType = null) {
  const start = (level - 1) % GEMS.length;
  const pool = [start, (start+1)%GEMS.length, (start+2)%GEMS.length, (start+3)%GEMS.length, (start+4)%GEMS.length];
  const colors = pool.slice(0,4);
  const posInCycle = (level - 1) % DIFFICULTY_CYCLE_LENGTH;
  const cyclePos = posInCycle + 1;
  const cycleIndex = Math.min(Math.floor((level - 1) / DIFFICULTY_CYCLE_LENGTH), DIFFICULTY_CYCLE_CAP);
  const rampRate = 1 + cycleIndex * DIFFICULTY_CYCLE_ESCALATION_RATE;
  const growthUnits = Math.round(posInCycle * rampRate);
  const growth = Math.floor(growthUnits / 2);
  const githubScore = SCORE_OBJECTIVE_BASE + growthUnits * SCORE_OBJECTIVE_GROWTH;

  // x1/x2 never reset to level-1 difficulty. x1 remains the breather.
  const chapterTriples = [
    [55,35,15],[70,45,20],[90,60,25],[115,76,32],[145,95,40],
    [180,118,50],[220,145,62],[265,175,75],[315,208,90],[370,245,108],[430,285,128]
  ];
  const [c1,c2,c3] = chapterTriples[Math.min(cycleIndex, chapterTriples.length-1)];
  if (cyclePos === 1) return [
    {kind:"color",type:colors[0],required:c1},
    {kind:"color",type:colors[1],required:c2},
    {kind:"color",type:colors[2],required:c3}
  ];
  if (cyclePos === 2) return [
    {kind:"color",type:colors[0],required:Math.round(c1*1.18)},
    {kind:"color",type:colors[1],required:Math.round(c2*1.18)},
    {kind:"color",type:colors[2],required:Math.max(c3+1,Math.round(c3*1.18))}
  ];

  // x4 Color Rush = original behavior, shorter by 15 sec per chapter.
  if (cyclePos === 4) {
    const favoredColor = colorRushType === null ? Math.floor(Math.random() * GEMS.length) : colorRushType;
    const seconds = Math.max(COLOR_RUSH_MIN_SECONDS, TIMED_COLOR_SECONDS - cycleIndex*15);
    return [{kind:"timedColor",type:favoredColor,required:1000 + growthUnits*20,timeLimitSeconds:seconds}];
  }

  // x5 / x11 Aftershock. The board resolver remains GitHub-original;
  // this mode raises collection pressure and gives the level a distinct identity.
  if (cyclePos === 5 || cyclePos === 11) {
    const second = cyclePos === 11;
    const main = (second ? 120 : 85) + cycleIndex*(second ? 28 : 22) + growth*2;
    return [
      {kind:"aftershock",required:true},
      {kind:"color",type:colors[0],required:main},
      {kind:"color",type:colors[1],required:Math.ceil(main*.70)},
      {kind:"color",type:colors[2],required:Math.ceil(main*.34)}
    ];
  }

  // x7 Focus I, strict 2:1.
  if (cyclePos === 7) {
    const main = 120 + cycleIndex*38 + growth*2;
    return [
      {kind:"color",type:colors[0],required:main},
      {kind:"color",type:colors[1],required:Math.ceil(main/2)}
    ];
  }

  // x8 Specialty I rotates actual specialty types.
  if (cyclePos === 8) {
    const powers = ["arrow","T","G","R"];
    return [{kind:"specialtyTrigger",power:powers[cycleIndex % powers.length],required:8 + cycleIndex*2 + Math.floor(growth/4)}];
  }

  // x10 Light Rush. Later chapters can remix Grass, Reverse Flow or Oil.
  // Oil and Reverse Flow are never present together.
  if (cyclePos === 10) {
    const out = [{kind:"lightRun",required:ROWS*COLS}];
    if (cycleIndex >= 3) {
      const phase = cycleIndex % 3;
      if (phase === 0) out.push({kind:"reverseFlow",required:true});
      else if (phase === 1) out.push({kind:"oilRush",required:2 + Math.floor(cycleIndex/2),timeLimitSeconds:null});
      // phase 2 uses Grass via pickObstaclesForLevel
    }
    return out;
  }

  // x14 Focus II = Focus + finite Scarcity + timer.
  if (cyclePos === 14) {
    const main = 650 + cycleIndex*140 + growth*4;
    const scarce = 3 + Math.floor(cycleIndex/2);
    return [
      {kind:"timedColor",type:colors[0],required:main,timeLimitSeconds:Math.max(75,150-cycleIndex*10)},
      {kind:"color",type:colors[1],required:Math.ceil(main/2)},
      {kind:"color",type:colors[2],required:scarce,exact:true}
    ];
  }

  // x15 Oil Drop = GitHub mode; resolver fix is isolated elsewhere.
  if (cyclePos === 15) {
    return [{kind:"oilRush",required:OIL_RUSH_BASE_COUNT + cycleIndex + Math.floor(growth/5),timeLimitSeconds:OIL_RUSH_SECONDS}];
  }

  // x17 Gravity Shift: target + 10 resolved-move challenge window.
  if (cyclePos === 17) {
    const main = 36 + cycleIndex*12 + growth*2;
    return [
      {kind:"gravityShift",required:GRAVITY_SHIFT_MOVE_LIMIT},
      {kind:"color",type:colors[0],required:main},
      {kind:"color",type:colors[1],required:Math.ceil(main*.62)}
    ];
  }

  // x18 Wall Street + Specialty II. No Score Pressure IV.
  if (cyclePos === 18) {
    return [
      {kind:"specialtyCombo",combo:"arrowT",required:2 + Math.floor(cycleIndex/2)},
      {kind:"specialtyCombo",combo:"TT",required:1 + Math.floor(cycleIndex/3)}
    ];
  }

  // x19 ALL-IN: compatible systems + specific specialty work + score.
  if (cyclePos === 19) {
    const allInScores = [800000,950000,1100000,1300000,1500000,1750000,2000000,2300000,2650000,3000000,3400000];
    const mainColor = 600 + cycleIndex*150;
    const secondColor = 360 + cycleIndex*95;
    const scarce = 8 + cycleIndex*2;
    return [
      {kind:"allIn",required:true},
      {kind:"lightRun",required:ROWS*COLS},
      {kind:"oilRush",required:2 + cycleIndex,timeLimitSeconds:null},
      {kind:"specialtyTrigger",power:"T",required:12 + cycleIndex*3},
      {kind:"specialtyCombo",combo:"arrowT",required:2 + Math.floor(cycleIndex/2)},
      {kind:"color",type:colors[0],required:mainColor},
      {kind:"color",type:colors[1],required:secondColor},
      {kind:"color",type:colors[2],required:scarce,exact:true},
      {kind:"score",required:allInScores[Math.min(cycleIndex,allInScores.length-1)]}
    ];
  }

  // x20 Finale = 3 stars + score + 4 colors, one finite scarce.
  if (cyclePos === 20) {
    const finaleScores = [700000,850000,1000000,1200000,1450000,1700000,2000000,2350000,2750000,3200000,3700000];
    const main = 450 + cycleIndex*120;
    return [
      {kind:"color",type:colors[0],required:main},
      {kind:"color",type:colors[1],required:Math.ceil(main*.67)},
      {kind:"color",type:colors[2],required:Math.ceil(main*.40)},
      {kind:"color",type:colors[3],required:3 + Math.floor(cycleIndex/2),exact:true},
      {kind:"score",required:finaleScores[Math.min(cycleIndex,finaleScores.length-1)]},
      {kind:"starChallenge",required:3}
    ];
  }

  // x12 and x16 preserve GitHub finite Scarcity 5:3:1.
  const isScarcity = cyclePos === 12 || cyclePos === 16;
  let colorObjectives;
  if (isScarcity) {
    const later = cyclePos === 16;
    const main = (later ? 200 : 150) + cycleIndex*(later ? 65 : 55);
    const scarce = (later ? 6 : 5) + cycleIndex*2;
    colorObjectives = [
      {kind:"color",type:colors[0],required:main},
      {kind:"color",type:colors[1],required:Math.ceil(main*.60)},
      {kind:"color",type:colors[2],required:scarce,exact:true}
    ];
  } else if ([3,9,13].includes(cyclePos)) {
    // Score Pressure keeps the original GitHub score formula, but its colour
    // requirements now scale to match the number of gems actually cleared.
    const baseBySlot = {
      3:[90,60,24],
      9:[200,135,50],
      13:[260,175,65]
    };
    const base = baseBySlot[cyclePos];
    const chapterFactor = 1 + cycleIndex*.28;
    colorObjectives = base.map((qty,i)=>({
      kind:"color",
      type:colors[i],
      required:Math.round(qty*chapterFactor),
      exact:false
    }));
  } else {
    // General 10x10 calibration: minimum total request is roughly one board,
    // then rises with position and chapter.
    const total = 105 + posInCycle*9 + cycleIndex*42;
    const qty = [Math.round(total*.54),Math.round(total*.32),Math.round(total*.14)];
    colorObjectives = colors.slice(0,3).map((type,i)=>({kind:"color",type,required:qty[i],exact:false}));
  }

  const objectives = [...colorObjectives];

  // Preserve original GitHub Score Pressure I, II, III score formula exactly.
  if ([3,9,13].includes(cyclePos)) {
    objectives.push({kind:"score",required:githubScore});
  }
  return objectives;
}

// Greedily converts a heat count into starting power-ups — rainbows first
// (biggest reward for the longest streaks), then TNT, arrow, grenade —
// capped at MAX_HEAT_POWERUPS total pieces. Returns the allocation plus how
// much heat was actually spent (any remainder keeps accumulating).
function heatToPowerups(heatValue) {
  const order = [{
    kind: "R",
    cost: POWERUP_COSTS.R
  }, {
    kind: "T",
    cost: POWERUP_COSTS.T
  }, {
    kind: "arrow",
    cost: POWERUP_COSTS.arrow
  }, {
    kind: "G",
    cost: POWERUP_COSTS.G
  }];
  let remaining = heatValue;
  let count = 0;
  const allocation = {
    G: 0,
    arrow: 0,
    T: 0,
    R: 0
  };
  for (const {
    kind,
    cost
  } of order) {
    while (remaining >= cost && count < MAX_HEAT_POWERUPS) {
      allocation[kind]++;
      remaining -= cost;
      count++;
    }
  }
  return {
    allocation,
    spent: heatValue - remaining
  };
}
function computeWeights(objectives) {
  const weights = Array(GEMS.length).fill(FILLER_WEIGHT);

  objectives.forEach(o => {
    if (o.kind === "color") {
      if (o.exact) {
        // Finite Scarcity remains truly finite: no refill spawns.
        weights[o.type] = 0;
      } else {
        // IMPORTANT: objective quota and spawn probability are separate systems.
        // Large 100–600+ objectives must not become 100–600x refill weights.
        // Square-root scaling preserves a useful preference without cascade flooding.
        const quota = Math.max(1, Number(o.required || 1));
        weights[o.type] = Math.min(36, FILLER_WEIGHT + Math.sqrt(quota));
      }
    }

    if (o.kind === "timedColor") {
      // Timed focus is intentionally favored, but still bounded.
      // This remains much more common than filler colors without flooding the board.
      weights[o.type] = 42;
    }
  });

  return weights;
}
function weightedType(weights) {
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    if (r < weights[i]) return i;
    r -= weights[i];
  }
  return weights.length - 1;
}
function cell(t, p = null, obstacle = null, bonus = null) {
  return {
    t,
    p,
    obstacle,
    bonus
  };
}
function idx(r, c) {
  return r * COLS + c;
}
function key(r, c) {
  return `${r}-${c}`;
}

// Would placing color `t` at (r,c) complete a match against cells already
// placed above/left of it? Used by makeBoard/shuffleBoard to build a
// match-free board cell-by-cell instead of generate-whole-board-and-retry,
// which can hang indefinitely under heavily skewed spawn weights (e.g.
// timedColor levels favor one color ~6x — an accident-free random board
// becomes astronomically unlikely to land on by chance).
function wouldCreateInitialMatch(board, r, c, t) {
  if (c >= 2 && board[r][c - 1] && board[r][c - 2] && board[r][c - 1].t === t && board[r][c - 2].t === t) return true;
  if (r >= 2 && board[r - 1][c] && board[r - 2][c] && board[r - 1][c].t === t && board[r - 2][c].t === t) return true;
  if (r >= 1 && c >= 1 && board[r - 1][c - 1] && board[r - 1][c] && board[r][c - 1] && board[r - 1][c - 1].t === t && board[r - 1][c].t === t && board[r][c - 1].t === t) return true;
  return false;
}
function makeBoard(weights) {
  const board = Array.from({
    length: ROWS
  }, () => Array(COLS).fill(null));
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let t = weightedType(weights);
      let tries = 0;
      while (wouldCreateInitialMatch(board, r, c, t) && tries < 30) {
        t = weightedType(weights);
        tries++;
      }
      if (wouldCreateInitialMatch(board, r, c, t)) {
        // pathological weighting — fall back to the first color that's legal here
        for (let candidate = 0; candidate < GEMS.length; candidate++) {
          if (!wouldCreateInitialMatch(board, r, c, candidate)) {
            t = candidate;
            break;
          }
        }
      }
      board[r][c] = cell(t);
    }
  }
  return board;
}

// Scatters exactly `count` gems of `color` onto a board that was generated with
// that color's spawn weight at 0, so it never respawns during refills — the
// player has to fish out exactly this many, no more ever appear.
function scatterExactColor(board, color, count) {
  let result = cloneBoard(board);
  let placed = 0;
  let attempts = 0;
  while (placed < count && attempts < 800) {
    attempts++;
    const r = Math.floor(Math.random() * ROWS);
    const c = Math.floor(Math.random() * COLS);
    if (result[r][c].t === color) continue;
    const trial = cloneBoard(result);
    trial[r][c] = cell(color, null);
    if (analyzeBoard(trial).groups.length === 0) {
      result = trial;
      placed++;
    }
  }
  // rare fallback if the board is too dense to place without a match — force it
  while (placed < count) {
    const r = Math.floor(Math.random() * ROWS);
    const c = Math.floor(Math.random() * COLS);
    if (result[r][c].t !== color) {
      result[r][c] = cell(color, null);
      placed++;
    }
  }
  return result;
}
function cloneBoard(board) {
  return board.map(row => row.map(c => c ? {
    ...c
  } : null));
}

// Every OBSTACLE_LEVEL_INTERVAL levels, one obstacle kind shows up, rotating
// through ice / wall / grass and scaling in count every 3 appearances.
function chapterTwistsForLevel(level) {
  const cycleIndex = Math.floor((level - 1) / DIFFICULTY_CYCLE_LENGTH);
  const cyclePos = (level - 1) % DIFFICULTY_CYCLE_LENGTH + 1;
  if (cycleIndex === 0) return [];
  const twists = [];

  // Later 20-level chapters remix already-learned systems instead of merely inflating quotas.
  if (cycleIndex >= 1 && [7, 14].includes(cyclePos)) twists.push("grass");
  if (cycleIndex >= 1 && [9, 13].includes(cyclePos)) twists.push("ice");
  if (cycleIndex >= 2 && cyclePos === 10) twists.push(cycleIndex % 3 === 2 ? "ice" : cycleIndex % 3 === 0 ? "wall" : "grass");
  if (cycleIndex >= 2 && cyclePos === 17) twists.push(cycleIndex % 2 === 0 ? "grass" : "ice");
  if (cycleIndex >= 3 && [3, 11].includes(cyclePos)) twists.push("wall");
  if (cycleIndex >= 4 && cyclePos === 15) twists.push(cycleIndex % 2 === 0 ? "ice" : "grass");
  if (cycleIndex >= 6 && [12, 16].includes(cyclePos)) twists.push("wall");
  if (cycleIndex >= 7 && cyclePos === 8) twists.push("grass");
  if (cycleIndex >= 8 && [6, 18].includes(cyclePos)) twists.push("allObstacles");
  return [...new Set(twists)];
}

function pickObstaclesForLevel(level) {
  const cyclePos = (level - 1) % DIFFICULTY_CYCLE_LENGTH + 1;
  const cycleIndex = Math.floor((level - 1) / DIFFICULTY_CYCLE_LENGTH);
  const base = Math.min(15, 3 + cycleIndex);

  if (cyclePos === 6) {
    // Ice Field: starting ice rises by chapter; spreading is handled after moves.
    return [{kind:"ice",count:Math.min(18,3 + cycleIndex*2)}];
  }
  if (cyclePos === 12) {
    // Grass Menace + Scarcity stays Grass-led in every chapter.
    return [{kind:"grass",count:Math.min(16,3 + cycleIndex*2)}];
  }
  if (cyclePos === 18) {
    // Wall Street owns the wall identity.
    return [{kind:"wall",count:Math.min(14,3 + cycleIndex)}];
  }
  if (cyclePos === 19) {
    return [
      {kind:"ice",count:Math.max(4,base)},
      {kind:"grass",count:Math.max(4,base)},
      {kind:"wall",count:Math.max(3,base-1)}
    ];
  }

  // Light Rush later chapters can carry Grass as the third remix option.
  if (cyclePos === 10 && cycleIndex >= 3 && cycleIndex % 3 === 2) {
    return [{kind:"grass",count:Math.min(14,4 + cycleIndex)}];
  }

  // Preserve useful later-chapter remixes from GitHub without changing core slots.
  const chapterTwists = chapterTwistsForLevel(level)
    .filter(kind => ["ice","grass","wall"].includes(kind));
  return chapterTwists.map(kind => ({
    kind,
    count:kind==="wall" ? Math.max(3,base-1) : Math.max(3,base)
  }));
}

// Scatters `count` obstacle overlays onto random cells, skipping any cell in
// avoidCells (e.g. exact-scarcity color cells, so an obstacle can't wall off
// a gem the player is required to clear).
function scatterObstacles(board, kind, count, avoidCells) {
  const result = cloneBoard(board);
  const cells = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!avoidCells.has(key(r, c)) && !result[r][c].obstacle) cells.push([r, c]);
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }
  const hits = kind === "ice" ? ICE_HITS : kind === "grass" ? GRASS_HITS : WALL_HITS;
  for (let i = 0; i < Math.min(count, cells.length); i++) {
    const [r, c] = cells[i];
    if (kind === "wall") {
      result[r][c] = cell(null, null, {
        kind: "wall",
