<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Diamond Run</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at top, #2b1f67 0%, #17113f 42%, #0d0b25 100%);
    min-height: 100vh;
  }
  #diamond-run-root {
    min-height: 100vh;
  }

  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #fff;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 15% 10%, rgba(77,184,255,.20), transparent 30%),
      radial-gradient(circle at 85% 18%, rgba(176,108,255,.20), transparent 28%),
      radial-gradient(circle at 50% 88%, rgba(255,92,122,.12), transparent 32%);
    z-index: 0;
  }
  #diamond-run-root { position: relative; z-index: 1; }
  .gem-cell {
    transition: transform .14s ease, box-shadow .18s ease, background .18s ease;
    backdrop-filter: blur(5px);
  }
  .gem-cell:hover { transform: translateY(-1px) scale(1.035); }
  .special-pulse { animation: specialPulse 1.05s ease-in-out infinite alternate; }
  @keyframes specialPulse {
    from { transform: scale(.96); filter: brightness(1); }
    to { transform: scale(1.08); filter: brightness(1.22) drop-shadow(0 0 8px rgba(255,255,255,.45)); }
  }
  .fx-beam { animation: beamFlash .55s ease-out; }
  .fx-beam-v { animation: beamFlash .55s ease-out; }
  .fx-grenade, .fx-tnt, .fx-rainbow { animation: burst .62s cubic-bezier(.22,.9,.31,1); }
  @keyframes beamFlash {
    0% { opacity: 0; transform: scale(.75); }
    30% { opacity: 1; transform: scale(1.06); }
    100% { opacity: 0; transform: scale(1); }
  }
  @keyframes burst {
    0% { opacity: 0; transform: scale(.22) rotate(-20deg); }
    45% { opacity: 1; transform: scale(1.18) rotate(8deg); }
    100% { opacity: 0; transform: scale(1.42) rotate(18deg); }
  }

</style>
</head>
<body>
<div id="diamond-run-root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script>
const {
  useState,
  useCallback,
  useRef,
  useEffect
} = React;

// ---- Config ----
const ROWS = 10;
const COLS = 10;
const GEMS = [{
  color: "#ff5c7a",
  shape: "flame"
}, {
  color: "#6fe28d",
  shape: "leaf"
}, {
  color: "#4db8ff",
  shape: "drop"
}, {
  color: "#ffd34f",
  shape: "star"
}, {
  color: "#b06cff",
  shape: "gem"
}];
const CARRY_START_LEVEL = 31;
const MOVES_DECADE_STEP = 10; // base starting moves drop by this much...
const MOVES_DECADE_INTERVAL = 10; // ...every this many levels past 31
const MOVES_FLOOR = 20; // base starting moves never go below this
const CARRY_CAP_BASE = 40;
const CARRY_CAP_STEP = 5; // carry-over cap drops by this much...
const CARRY_CAP_INTERVAL = 3; // ...every this many levels past 31
const CARRY_CAP_FLOOR = 10;
const POWERUP_COSTS = {
  G: 2,
  arrow: 4,
  T: 6,
  R: 10
}; // excess moves needed per power-up
const MAX_HEAT_POWERUPS = 5; // heat-to-powerup conversion never seeds more than this many pieces
const HEAT_START_LEVEL = 21; // the heat meter doesn't begin tracking until this level
const DIFFICULTY_CYCLE_LENGTH = 20; // difficulty ramps easy→hardest across a 20-level cycle, then resets
const DIFFICULTY_CYCLE_ESCALATION_RATE = 0.5; // each successive cycle ramps steeper, so its "hardest" tops the last
const DIFFICULTY_CYCLE_CAP = 10; // stop escalating across cycles after this many repeats (long-run safety)
const FILLER_WEIGHT = 12;
const BONUS_POINTS_PER_GEM = 1000;
const SCORE_OBJECTIVE_LEVEL_INTERVAL = 3; // every 3rd level also requires a minimum score
const SCORE_OBJECTIVE_BASE = 100000;
const SCORE_OBJECTIVE_GROWTH = 16000;
const SCARCITY_LEVEL_INTERVAL = 4; // every 4th level, the rarest color is exact-count on the board
const FOCUS_LEVEL_INTERVAL = 7; // every 7th level, one color dominates the board
const CHECKPOINT_INTERVAL = 10; // progress is saved every 10 levels
const GRID_GAP = 4;
const GRID_PAD = 10;
const ICE_HITS = 1;
const GRASS_HITS = 2;
const WALL_HITS = 3;
const OBSTACLE_LEVEL_INTERVAL = 6; // every 6th level introduces ice, walls, or grass
const OIL_DROP_LEVEL_INTERVAL = 5; // every 5th level seeds one TUH oil-drop bonus tile
const OIL_DROP_BONUS_MOVES = 2;
const OIL_DROP_BONUS_SCORE = 500;
const BONUS_LEVEL_INTERVAL = 5;
const TIMED_COLOR_SECONDS = 180; // 3 minutes, per your "get 2000 yellow in 3 minutes" example

// Levels 1–30: move counts vary (not a strict curve) between 25 and 40.
// From level 31 on, base starting moves step down by decade block (40 for
// 31-40, 30 for 41-50, 20 for 51-60 and onward — 20 is the permanent floor).
// Leftover moves separately carry over into the next level's total, capped by
// a declining ceiling (see carryCapForLevel) — excess beyond that cap
// converts to bonus rainbow gems instead of being lost.
function baseMovesForLevel(level) {
  if (level >= CARRY_START_LEVEL) {
    const steps = Math.floor((level - CARRY_START_LEVEL) / MOVES_DECADE_INTERVAL);
    return Math.max(MOVES_FLOOR, 40 - steps * MOVES_DECADE_STEP);
  }
  return 25 + Math.floor(Math.random() * 16); // 25..40, re-rolled each time the level starts
}

// The carry-over cap for moves finishing on `level` (carrying into level+1).
// 40 for levels 31-33, then drops by 5 every 3 levels, flooring at 10.
function carryCapForLevel(level) {
  if (level < CARRY_START_LEVEL) return 0;
  const steps = Math.floor((level - CARRY_START_LEVEL) / CARRY_CAP_INTERVAL);
  return Math.max(CARRY_CAP_FLOOR, CARRY_CAP_BASE - steps * CARRY_CAP_STEP);
}
function checkpointFor(level) {
  if (level <= CHECKPOINT_INTERVAL) return 1;
  return Math.floor((level - 1) / CHECKPOINT_INTERVAL) * CHECKPOINT_INTERVAL;
}

// 3 of the 5 colors get a quota each level; the other 2 are unrestricted filler.
// The color needed in the smallest quantity is deliberately the rarest to find.
// Every few levels also adds a minimum-score objective, an exact-count "scarcity"
// color, or a "focus" level where one color dominates the whole board.
function generateObjectives(level) {
  const start = (level - 1) % GEMS.length;
  const colors = [start, (start + 1) % GEMS.length, (start + 2) % GEMS.length];
  // Difficulty ramps easy → hardest across a 20-level cycle (posInCycle 0-19),
  // then resets to easy at the start of the next cycle — but each successive
  // cycle ramps a bit steeper, so its "hardest" tops the previous cycle's.
  const posInCycle = (level - 1) % DIFFICULTY_CYCLE_LENGTH;
  const cycleIndex = Math.min(Math.floor((level - 1) / DIFFICULTY_CYCLE_LENGTH), DIFFICULTY_CYCLE_CAP);
  const rampRate = 1 + cycleIndex * DIFFICULTY_CYCLE_ESCALATION_RATE;
  const growthUnits = Math.round(posInCycle * rampRate); // resets to 0 each cycle, peak rises per cycle
  const growth = Math.floor(growthUnits / 2);

  // Every BONUS_LEVEL_INTERVAL levels, replace the usual quotas with one
  // standalone goal — alternating between a timed color rush and a
  // specialty-gem trigger count. Both scale with the same difficulty curve.
  if (level % BONUS_LEVEL_INTERVAL === 0) {
    const bonusIndex = Math.floor(level / BONUS_LEVEL_INTERVAL);
    if (bonusIndex % 2 === 1) {
      const favoredColor = (level - 1) % GEMS.length;
      return [{
        kind: "timedColor",
        type: favoredColor,
        required: 1000 + growthUnits * 20,
        timeLimitSeconds: TIMED_COLOR_SECONDS
      }];
    }
    const powers = ["T", "G", "arrow"];
    const power = powers[bonusIndex % powers.length];
    return [{
      kind: "specialtyTrigger",
      power,
      required: 15 + Math.floor(growth / 2)
    }];
  }
  const isFocus = level % FOCUS_LEVEL_INTERVAL === 0;
  const isScarcity = !isFocus && level % SCARCITY_LEVEL_INTERVAL === 0;
  let colorObjectives;
  if (isFocus) {
    const bigQty = 40 + growth * 3;
    colorObjectives = [{
      kind: "color",
      type: colors[0],
      required: bigQty
    }, {
      kind: "color",
      type: colors[1],
      required: 10 + Math.floor(growth / 2)
    }];
  } else {
    const qty = [20 + growth * 2, 15 + growth, 5 + Math.floor(growthUnits / 3)];
    colorObjectives = colors.map((type, i) => ({
      kind: "color",
      type,
      required: qty[i],
      exact: isScarcity && i === 2
    }));
  }
  const objectives = [...colorObjectives];
  if (level % SCORE_OBJECTIVE_LEVEL_INTERVAL === 0) {
    objectives.push({
      kind: "score",
      required: SCORE_OBJECTIVE_BASE + growthUnits * SCORE_OBJECTIVE_GROWTH
    });
  }
  return objectives;
}

// Greedily converts a heat count into starting power-ups — rainbows first
// (biggest reward for the longest streaks), then TNT, arrow, grenade —
// capped at MAX_HEAT_POWERUPS total pieces. Returns the allocation plus how
// much heat was actually spent (any remainder keeps accumulating).
function heatToPowerups(heatValue) {
  const order = [{
    kind: "R",
    cost: POWERUP_COSTS.R
  }, {
    kind: "T",
    cost: POWERUP_COSTS.T
  }, {
    kind: "arrow",
    cost: POWERUP_COSTS.arrow
  }, {
    kind: "G",
    cost: POWERUP_COSTS.G
  }];
  let remaining = heatValue;
  let count = 0;
  const allocation = {
    G: 0,
    arrow: 0,
    T: 0,
    R: 0
  };
  for (const {
    kind,
    cost
  } of order) {
    while (remaining >= cost && count < MAX_HEAT_POWERUPS) {
      allocation[kind]++;
      remaining -= cost;
      count++;
    }
  }
  return {
    allocation,
    spent: heatValue - remaining
  };
}
function computeWeights(objectives) {
  const weights = Array(GEMS.length).fill(FILLER_WEIGHT);
  objectives.forEach(o => {
    if (o.kind === "color") weights[o.type] = o.exact ? 0 : o.required;
    if (o.kind === "timedColor") weights[o.type] = FILLER_WEIGHT * 6; // heavily favored to drop
  });
  return weights;
}
function weightedType(weights) {
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    if (r < weights[i]) return i;
    r -= weights[i];
  }
  return weights.length - 1;
}
function cell(t, p = null, obstacle = null, bonus = null) {
  return {
    t,
    p,
    obstacle,
    bonus
  };
}
function idx(r, c) {
  return r * COLS + c;
}
function key(r, c) {
  return `${r}-${c}`;
}

// Would placing color `t` at (r,c) complete a match against cells already
// placed above/left of it? Used by makeBoard/shuffleBoard to build a
// match-free board cell-by-cell instead of generate-whole-board-and-retry,
// which can hang indefinitely under heavily skewed spawn weights (e.g.
// timedColor levels favor one color ~6x — an accident-free random board
// becomes astronomically unlikely to land on by chance).
function wouldCreateInitialMatch(board, r, c, t) {
  if (c >= 2 && board[r][c - 1] && board[r][c - 2] && board[r][c - 1].t === t && board[r][c - 2].t === t) return true;
  if (r >= 2 && board[r - 1][c] && board[r - 2][c] && board[r - 1][c].t === t && board[r - 2][c].t === t) return true;
  if (r >= 1 && c >= 1 && board[r - 1][c - 1] && board[r - 1][c] && board[r][c - 1] && board[r - 1][c - 1].t === t && board[r - 1][c].t === t && board[r][c - 1].t === t) return true;
  return false;
}
function makeBoard(weights) {
  const board = Array.from({
    length: ROWS
  }, () => Array(COLS).fill(null));
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let t = weightedType(weights);
      let tries = 0;
      while (wouldCreateInitialMatch(board, r, c, t) && tries < 30) {
        t = weightedType(weights);
        tries++;
      }
      if (wouldCreateInitialMatch(board, r, c, t)) {
        // pathological weighting — fall back to the first color that's legal here
        for (let candidate = 0; candidate < GEMS.length; candidate++) {
          if (!wouldCreateInitialMatch(board, r, c, candidate)) {
            t = candidate;
            break;
          }
        }
      }
      board[r][c] = cell(t);
    }
  }
  return board;
}

// Scatters exactly `count` gems of `color` onto a board that was generated with
// that color's spawn weight at 0, so it never respawns during refills — the
// player has to fish out exactly this many, no more ever appear.
function scatterExactColor(board, color, count) {
  let result = cloneBoard(board);
  let placed = 0;
  let attempts = 0;
  while (placed < count && attempts < 800) {
    attempts++;
    const r = Math.floor(Math.random() * ROWS);
    const c = Math.floor(Math.random() * COLS);
    if (result[r][c].t === color) continue;
    const trial = cloneBoard(result);
    trial[r][c] = cell(color, null);
    if (analyzeBoard(trial).groups.length === 0) {
      result = trial;
      placed++;
    }
  }
  // rare fallback if the board is too dense to place without a match — force it
  while (placed < count) {
    const r = Math.floor(Math.random() * ROWS);
    const c = Math.floor(Math.random() * COLS);
    if (result[r][c].t !== color) {
      result[r][c] = cell(color, null);
      placed++;
    }
  }
  return result;
}
function cloneBoard(board) {
  return board.map(row => row.map(c => c ? {
    ...c
  } : null));
}

// Every OBSTACLE_LEVEL_INTERVAL levels, one obstacle kind shows up, rotating
// through ice / wall / grass and scaling in count every 3 appearances.
function pickObstaclesForLevel(level) {
  if (level % OBSTACLE_LEVEL_INTERVAL !== 0) return null;
  const cycle = Math.floor(level / OBSTACLE_LEVEL_INTERVAL) - 1;
  const kind = ["ice", "wall", "grass"][(cycle % 3 + 3) % 3];
  const count = Math.min(10, 3 + Math.floor(cycle / 3));
  return {
    kind,
    count
  };
}

// Scatters `count` obstacle overlays onto random cells, skipping any cell in
// avoidCells (e.g. exact-scarcity color cells, so an obstacle can't wall off
// a gem the player is required to clear).
function scatterObstacles(board, kind, count, avoidCells) {
  const result = cloneBoard(board);
  const cells = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!avoidCells.has(key(r, c))) cells.push([r, c]);
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }
  const hits = kind === "ice" ? ICE_HITS : kind === "grass" ? GRASS_HITS : WALL_HITS;
  for (let i = 0; i < Math.min(count, cells.length); i++) {
    const [r, c] = cells[i];
    if (kind === "wall") {
      result[r][c] = cell(null, null, {
        kind: "wall",
        hits
      });
    } else {
      result[r][c] = cell(result[r][c].t, null, {
        kind,
        hits
      });
    }
  }
  return result;
}
function scatterOilDrop(board, avoidCells) {
  const result = cloneBoard(board);
  const cells = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!avoidCells.has(key(r, c)) && result[r][c].t !== null) cells.push([r, c]);
  if (cells.length === 0) return result;
  const [r, c] = cells[Math.floor(Math.random() * cells.length)];
  result[r][c] = {
    ...result[r][c],
    bonus: "oil"
  };
  return result;
}

// Central obstacle resolver: takes a raw set of cells a clear-step wants to
// remove, and applies ice/grass absorption + wall adjacency damage. Returns
// the board with obstacle hit-counters updated, the ACTUAL cells that clear
// this round (obstacles that survived are removed from it), and any oil-drop
// bonus cells swept up along the way.
function processClear(board, rawClearSet) {
  const next = cloneBoard(board);
  const actual = new Set();
  const bonuses = [];
  rawClearSet.forEach(k => {
    const [r, c] = k.split("-").map(Number);
    const d = next[r][c];
    if (!d) return;
    if (d.obstacle && d.obstacle.kind === "ice") {
      const hits = d.obstacle.hits - 1;
      next[r][c] = {
        ...d,
        obstacle: hits > 0 ? {
          kind: "ice",
          hits
        } : null
      };
      return; // ice absorbs the hit — the gem itself survives this round
    }
    if (d.obstacle && d.obstacle.kind === "grass") {
      const hits = d.obstacle.hits - 1;
      if (hits > 0) {
        next[r][c] = {
          ...d,
          obstacle: {
            kind: "grass",
            hits
          }
        };
        return; // survives, needs one more hit
      }
      // hits hit 0 — clears along with the gem this round, fall through
    }
    if (d.bonus === "oil") bonuses.push(k);
    actual.add(k);
  });

  // Walls: a direct sweep (caught in a blast's own area) breaks instantly;
  // otherwise any wall next to an actually-clearing cell takes one hit.
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const d = next[r][c];
      if (!d || !d.obstacle || d.obstacle.kind !== "wall") continue;
      const kHere = key(r, c);
      if (rawClearSet.has(kHere)) {
        actual.add(kHere);
        continue;
      }
      const neighbors = [key(r - 1, c), key(r + 1, c), key(r, c - 1), key(r, c + 1)];
      if (neighbors.some(nk => actual.has(nk))) {
        const hits = d.obstacle.hits - 1;
        if (hits > 0) next[r][c] = {
          ...d,
          obstacle: {
            kind: "wall",
            hits
          }
        };else actual.add(kHere);
      }
    }
  }
  return {
    board: next,
    clearSet: actual,
    bonuses
  };
}

// ---- Union-Find ----
class DSU {
  constructor(n) {
    this.parent = Array.from({
      length: n
    }, (_, i) => i);
  }
  find(x) {
    while (this.parent[x] !== x) {
      this.parent[x] = this.parent[this.parent[x]];
      x = this.parent[x];
    }
    return x;
  }
  union(a, b) {
    const ra = this.find(a),
      rb = this.find(b);
    if (ra !== rb) this.parent[ra] = rb;
  }
}
function analyzeBoard(board) {
  const n = ROWS * COLS;
  const dsu = new DSU(n);
  const isSquare = new Set();
  const hRun = new Map();
  const vRun = new Map();
  for (let r = 0; r < ROWS - 1; r++) {
    for (let c = 0; c < COLS - 1; c++) {
      const a = board[r][c],
        b = board[r][c + 1],
        d = board[r + 1][c],
        e = board[r + 1][c + 1];
      if (a && b && d && e && a.t !== null && a.t === b.t && a.t === d.t && a.t === e.t) {
        dsu.union(idx(r, c), idx(r, c + 1));
        dsu.union(idx(r, c), idx(r + 1, c));
        dsu.union(idx(r, c), idx(r + 1, c + 1));
        [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]].forEach(([rr, cc]) => isSquare.add(key(rr, cc)));
      }
    }
  }
  for (let r = 0; r < ROWS; r++) {
    let run = 1;
    for (let c = 1; c <= COLS; c++) {
      const same = c < COLS && board[r][c] && board[r][c - 1] && board[r][c].t !== null && board[r][c].t === board[r][c - 1].t;
      if (same) run++;else {
        if (run >= 3) {
          for (let k = c - run; k < c; k++) {
            hRun.set(key(r, k), run);
            if (k > c - run) dsu.union(idx(r, k), idx(r, k - 1));
          }
        }
        run = 1;
      }
    }
  }
  for (let c = 0; c < COLS; c++) {
    let run = 1;
    for (let r = 1; r <= ROWS; r++) {
      const same = r < ROWS && board[r][c] && board[r - 1][c] && board[r][c].t !== null && board[r][c].t === board[r - 1][c].t;
      if (same) run++;else {
        if (run >= 3) {
          for (let k = r - run; k < r; k++) {
            vRun.set(key(k, c), run);
            if (k > r - run) dsu.union(idx(k, c), idx(k - 1, c));
          }
        }
        run = 1;
      }
    }
  }
  const flagged = new Set([...isSquare, ...hRun.keys(), ...vRun.keys()]);
  if (flagged.size === 0) return {
    groups: []
  };
  const groupMap = new Map();
  flagged.forEach(k => {
    const [r, c] = k.split("-").map(Number);
    const root = dsu.find(idx(r, c));
    if (!groupMap.has(root)) {
      groupMap.set(root, {
        cells: new Set(),
        hasSquare: false,
        maxH: 0,
        maxV: 0,
        type: board[r][c].t
      });
    }
    const g = groupMap.get(root);
    g.cells.add(k);
    if (isSquare.has(k)) g.hasSquare = true;
    if (hRun.has(k)) g.maxH = Math.max(g.maxH, hRun.get(k));
    if (vRun.has(k)) g.maxV = Math.max(g.maxV, vRun.get(k));
  });
  const groups = [...groupMap.values()].map(g => {
    let power = null;
    if (g.maxH >= 5 || g.maxV >= 5) power = "R";else if (g.maxH >= 3 && g.maxV >= 3) power = "T";else if (g.hasSquare) power = "G";else if (g.maxH === 4) power = "H";else if (g.maxV === 4) power = "V";
    return {
      cells: g.cells,
      power,
      type: g.type
    };
  });
  return {
    groups
  };
}
function pickAnchor(cellsSet, swapHints) {
  const cells = [...cellsSet];
  if (swapHints) {
    for (const hint of swapHints) {
      if (cellsSet.has(hint)) return hint;
    }
  }
  return cells.sort()[0];
}
function areaCells(power, r, c) {
  const out = [];
  if (power === "H") {
    for (let cc = 0; cc < COLS; cc++) out.push(key(r, cc));
  } else if (power === "V") {
    for (let rr = 0; rr < ROWS; rr++) out.push(key(rr, c));
  } else if (power === "G") {
